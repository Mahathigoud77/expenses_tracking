services:
  - type: web
    name: smart-expense-tracker-backend
    runtime: python
    pythonVersion: 3.10
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    workingDirectory: backend
    envVars:
      - key: DATABASE_URL
        scope: shared
      - key: SECRET_KEY
        scope: shared
      - key: PYTHONUNBUFFERED
        value: "1"
    repo: https://github.com/yourusername/your-repo  # Update this

  - type: web
    name: smart-expense-tracker-frontend
    runtime: static
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_BASE
        value: https://smart-expense-tracker-backend.onrender.com  # Update this
    repo: https://github.com/yourusername/your-repo  # Update this
